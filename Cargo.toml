[package]
name = "eywa-utoipa"
version = "0.1.0"
edition = "2024"

[dependencies]
# Axum
axum = "0.8.8"

# Utoipa
utoipa = "5.4.0"
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"], optional = true }
utoipa-swagger-ui = { version = "8", optional = true }

# Serde
serde = "1.0.228"
serde_json = "1.0"

# Eywa ecosystem
eywa-hateoas = { git = "https://github.com/EywaOS/eywa-hateoas" }
eywa-errors = { git = "https://github.com/EywaOS/eywa-errors" }

[features]
default = []
scalar = ["utoipa-scalar"]
swagger-ui = ["utoipa-swagger-ui"]
